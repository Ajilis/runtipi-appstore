name: Rendevo image

on:
  push:
    branches: [main]
    paths:
      - 'sources/rendevo/**'
      - '.github/workflows/rendevo-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rendevo-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./sources/rendevo/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Check server sources
        working-directory: sources/rendevo
        run: for f in $(find server -name '*.js'); do node --check "$f"; done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sources/rendevo
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/rendevo:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/rendevo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
