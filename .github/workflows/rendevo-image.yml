name: Rendevo image

on:
  push:
    branches: [main]
    paths:
      - 'sources/rendevo/**'
      - 'apps/rendevo/**'
      - '.github/workflows/rendevo-image.yml'
  pull_request:
    paths:
      - 'sources/rendevo/**'
      - 'apps/rendevo/**'
      - '.github/workflows/rendevo-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: rendevo-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Metadata
        id: meta
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./sources/rendevo/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate Runtipi catalog manifest
        run: |
          node -e '
            const fs = require("node:fs");
            const app = require("./apps/rendevo/config.json");
            const pkg = require("./sources/rendevo/package.json");
            const compose = fs.readFileSync("./apps/rendevo/docker-compose.yml", "utf8");
            for (const field of ["created_at", "updated_at"]) {
              if (!Number.isInteger(app[field]) || app[field] >= Date.now()) {
                throw new Error(field + " must be an earlier Unix millisecond timestamp");
              }
            }
            if (app.version !== pkg.version || !compose.includes("ghcr.io/ajilis/rendevo:" + app.version)) {
              throw new Error("Catalog, package and Docker image versions must match");
            }
          '

      - name: Check server sources
        working-directory: sources/rendevo
        run: for f in $(find server -name '*.js'); do node --check "$f"; done

      - name: Test LinkedIn session connector
        working-directory: sources/rendevo
        run: node --test tests/*.test.mjs

      - name: Build updated web UI
        working-directory: sources/rendevo
        run: |
          npm install --no-audit --no-fund
          npm run build:web

      - name: Validate Chrome Companion extension
        working-directory: sources/rendevo
        run: |
          node --check extension/popup.js
          node -e 'const m = require("./extension/manifest.json"); if (m.manifest_version !== 3 || JSON.stringify(m.permissions) !== JSON.stringify(["activeTab", "scripting", "storage", "permissions"]) || m.optional_host_permissions !== undefined || m.host_permissions || m.content_scripts || m.background) throw new Error("Unexpected Chrome Companion permissions");'

      - name: Chrome Companion templates (not installable until personalized by Rendevo)
        uses: actions/upload-artifact@v4
        with:
          name: Rendevo-Companion-SOURCE-V25
          path: |
            sources/rendevo/extension/manifest.json
            sources/rendevo/extension/popup.html
            sources/rendevo/extension/popup.js
            sources/rendevo/extension/popup.css
            sources/rendevo/extension/README.md
          if-no-files-found: error
          retention-days: 90


      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: sources/rendevo
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/rendevo:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/rendevo:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
