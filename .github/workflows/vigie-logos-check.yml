name: Vigie logos check

# Contrôle depuis Internet : logos du catalogue et sources de données des établissements.
on:
  workflow_dispatch:
  push:
    branches: [vigie-logos-check]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Sources de données
        run: node .github/vigie/probe-sources.mjs
