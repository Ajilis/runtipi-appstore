# CloakBrowser 0.6.3 | Runtipi 4.9.1 | LAN + Cloudflare Tunnel | rev 4
# IMPORTANT : CDP n'a pas d'authentification native. Limiter le port au LAN
# par pare-feu et imposer Cloudflare Access sur le hostname du tunnel.
# Pas de x-runtipi.is_main, pas de reseau Traefik, aucun proxy ajoute.
services:
  cloakbrowser:
    image: cloakhq/cloakbrowser:0.6.3
    restart: unless-stopped
    init: true
    # Runtipi arrete le service avant sauvegarde : laisser le temps a Chromium
    # de fermer les profils et au lanceur de retirer les liens Singleton*.
    stop_grace_period: 120s
    shm_size: "1gb"
    environment:
      TZ: "${TZ:-Europe/Paris}"
      CLOAKBROWSER_LICENSE_KEY: "${CLOAKBROWSER_LICENSE_KEY:-}"
    ports:
      # Port fixe : evite l'echec du parseur de ports Runtipi 4.9.1
      # 8291 accessible sur le LAN ; bloquer les sources non-LAN au pare-feu.
      - "8291:9222/tcp"
    volumes:
      - "${APP_DATA_DIR}/config:/config"
      - "${APP_DATA_DIR}/profiles:/profiles"
      - "${APP_DATA_DIR}/cache:/root/.cloakbrowser"
    # cloakserve efface normalement les profils a leur expiration.
    # Le lanceur preserve les donnees et retire uniquement les symlinks
    # Singleton* avant demarrage et apres arret des navigateurs.
    command:
      - /bin/sh
      - -ec
      - |
        exec python - <<'PY'
        import importlib.machinery
        import importlib.util
        import json
        import math
        import sys
        from pathlib import Path

        config_path = Path('/config/cloakserve.json')
        if not config_path.exists():
            config_path.write_text(
                json.dumps({'idle_timeout_seconds': 300, 'headless': True}, indent=2) + '\n',
                encoding='utf-8',
            )
        settings = json.loads(config_path.read_text(encoding='utf-8'))
        idle = float(settings.get('idle_timeout_seconds', 300))
        if not math.isfinite(idle) or idle < 0:
            raise ValueError('idle_timeout_seconds doit etre fini et positif ou nul')
        headless = settings.get('headless', True)
        if not isinstance(headless, bool):
            raise ValueError('headless doit etre un booleen')

        # Charger le cloakserve inclus dans l'image officielle, sans fork.
        loader = importlib.machinery.SourceFileLoader(
            'cloakserve_persistent', '/usr/local/bin/cloakserve'
        )
        spec = importlib.util.spec_from_loader(loader.name, loader)
        module = importlib.util.module_from_spec(spec)
        sys.modules[spec.name] = module
        loader.exec_module(module)

        # Conserver profils, cookies et SQLite, tout en eliminant les seuls
        # liens symboliques temporaires de verrouillage Chromium.
        # Runtipi refuse ces liens lors de la creation d'une sauvegarde.
        profile_root = Path('/profiles')
        singleton_names = ('SingletonLock', 'SingletonSocket', 'SingletonCookie')

        def clean_singletons(profile):
            profile = Path(profile)
            # N'accepter qu'un dossier directement sous /profiles.
            # Ne jamais suivre un symlink ni supprimer de fichier ordinaire.
            if profile.parent != profile_root or profile.is_symlink() or not profile.is_dir():
                return
            for name in singleton_names:
                link = profile / name
                try:
                    if link.is_symlink():
                        link.unlink()
                except OSError:
                    module.logger.exception("Impossible de nettoyer %s", link)

        def clean_stale_singletons():
            for entry in profile_root.iterdir():
                clean_singletons(entry)

        def preserve_profile(self, path):
            # Appele par cloakserve apres l'arret du processus Chrome.
            clean_singletons(path)

        module.ChromePool._safe_rmtree = preserve_profile

        # Un arret brutal anterieur peut laisser des verrous dans des profils
        # inactifs. Les retirer AVANT le premier demarrage Chromium.
        clean_stale_singletons()

        # Lors d'une sauvegarde Runtipi, Docker stoppe le conteneur AVANT de
        # copier les donnees : nettoyer aussi les profils inactifs a l'arret.
        upstream_shutdown = module.ChromePool.shutdown
        async def shutdown_and_clean(self):
            previous_processes = [p.process for p in self._processes.values()]
            try:
                await upstream_shutdown(self)
            finally:
                if all(proc.poll() is not None for proc in previous_processes):
                    clean_stale_singletons()
                else:
                    module.logger.warning(
                        "Arret Chromium incomplet : verrous conserves pour securite"
                    )
        module.ChromePool.shutdown = shutdown_and_clean

        # cloakserve lance Chromium directement (subprocess.Popen) : son option
        # headless=True ne transmet pas le vrai flag --headless a Chromium.
        # A l'inverse, Playwright l'ajoute automatiquement avec launch().
        # Sans ce flag, le serveur CDP peut echouer avec un HTTP 502.
        original_wait = module.ChromePool._wait_for_cdp
        async def wait_for_cdp(port, timeout=45.0):
            return await original_wait(port, timeout=timeout)
        module.ChromePool._wait_for_cdp = staticmethod(wait_for_cdp)

        sys.argv = ['cloakserve', '--port=9222', '--data-dir=/profiles',
                    f'--idle-timeout={idle}']
        if headless:
            sys.argv.append('--headless=new')
        else:
            sys.argv.append('--headless=false')
        module.main()
        PY
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9222/"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      traefik.enable: "false"

x-runtipi:
  schema_version: 2
