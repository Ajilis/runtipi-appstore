# Postiz sans Elasticsearch, pour Ajilis/Runtipi et Cloudflare Tunnel.
# Le tunnel Cloudflare doit atteindre le port hôte local 8286.
# Toutes les dépendances restent sur le réseau Docker interne.
services:
  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    environment:
      MAIN_URL: "${POSTIZ_PUBLIC_URL}"
      FRONTEND_URL: "${POSTIZ_PUBLIC_URL}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_PUBLIC_URL}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-db:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "postiz-temporal:7233"
      IS_GENERAL: "true"
      RUN_CRON: "true"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - "${APP_DATA_DIR}/config:/config"
      - "${APP_DATA_DIR}/uploads:/uploads"
    depends_on:
      postiz-db:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      postiz-temporal:
        condition: service_healthy
    networks:
      - postiz-internal
    ports:
      - "127.0.0.1:${APP_PORT:-8286}:5000"
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://localhost:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    x-runtipi:
      is_main: true
      internal_port: 5000

  postiz-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}"
      POSTGRES_DB: postiz
    volumes:
      - "${APP_DATA_DIR}/postgres:/var/lib/postgresql/data"
    networks:
      - postiz-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 10

  postiz-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "${APP_DATA_DIR}/redis:/data"
    networks:
      - postiz-internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  postiz-temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTIZ_TEMPORAL_DB_PASSWORD}"
      POSTGRES_DB: temporal
    volumes:
      - "${APP_DATA_DIR}/temporal-postgres:/var/lib/postgresql/data"
    networks:
      - postiz-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 10

  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTIZ_TEMPORAL_DB_PASSWORD}"
      POSTGRES_SEEDS: postiz-temporal-db
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
      TEMPORAL_NAMESPACE: default
    depends_on:
      postiz-temporal-db:
        condition: service_healthy
    networks:
      - postiz-internal
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "postiz-temporal:7233"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 90s

networks:
  postiz-internal:
    driver: bridge

x-runtipi:
  schema_version: 2
