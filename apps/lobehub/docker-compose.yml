# LobeHub 2.3.2 - Runtipi >= 4.9.1
# Acces LAN direct et Cloudflare Tunnel, sans routage Traefik.
# LobeHub : http://IP_DU_SERVEUR:8292
# RustFS S3 : http://IP_DU_SERVEUR:8293 (necessaire pour les uploads navigateur).
services:
  lobehub-init:
    image: node:24-alpine
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require('node:fs');
        const crypto = require('node:crypto');
        const file = '/config/jwks.json';
        // RustFS 1.x s'execute en UID/GID 10001.
        fs.chownSync('/rustfs-data', 10001, 10001);
        if (!fs.existsSync(file)) {
          const { privateKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
          const key = {
            ...privateKey.export({ format: 'jwk' }),
            alg: 'RS256',
            use: 'sig',
            kid: crypto.randomBytes(8).toString('hex')
          };
          fs.writeFileSync(file, JSON.stringify({ keys: [key] }), { flag: 'wx', mode: 0o600 });
          fs.chownSync(file, 1001, 1001);
          console.log('JWKS prive cree et conserve dans config/jwks.json.');
        }
        const jwks = JSON.parse(fs.readFileSync(file, 'utf8'));
        if (!Array.isArray(jwks.keys) || !jwks.keys[0]?.d) throw new Error('JWKS invalide');
    volumes:
      - "${APP_DATA_DIR}/config:/config"
      - "${APP_DATA_DIR}/rustfs:/rustfs-data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

  lobehub:
    image: lobehub/lobehub:2.3.2
    restart: unless-stopped
    entrypoint: ["/bin/node", "-e"]
    command:
      - |
        const fs = require('node:fs');
        const jwks = JSON.parse(fs.readFileSync('/app/runtipi-config/jwks.json', 'utf8'));
        if (!Array.isArray(jwks.keys) || !jwks.keys[0]?.d) throw new Error('JWKS absent ou invalide');
        process.env.JWKS_KEY = JSON.stringify(jwks);
        require('/app/startServer.js');
    environment:
      NODE_ENV: production
      APP_URL: "${LOBE_PUBLIC_URL}"
      INTERNAL_APP_URL: "http://localhost:3210"
      AUTH_ADDITIONAL_TRUSTED_ORIGINS: "${LOBE_LAN_ORIGIN}"
      AUTH_ALLOWED_EMAILS: "${LOBE_ALLOWED_EMAILS}"
      AUTH_SECRET: "${LOBE_AUTH_SECRET}"
      KEY_VAULTS_SECRET: "${LOBE_KEY_VAULTS_SECRET}"
      DATABASE_URL: "postgresql://postgres:${LOBE_DB_PASSWORD}@postgresql:5432/lobehub"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "lobehub"
      REDIS_TLS: "0"
      S3_ENDPOINT: "${LOBE_S3_PUBLIC_URL}"
      S3_INTERNAL_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: "lobe"
      S3_ENABLE_PATH_STYLE: "1"
      S3_ACCESS_KEY: "${LOBE_S3_ACCESS_KEY}"
      S3_ACCESS_KEY_ID: "${LOBE_S3_ACCESS_KEY}"
      S3_SECRET_ACCESS_KEY: "${LOBE_S3_SECRET_KEY}"
      S3_SET_ACL: "0"
      LLM_VISION_IMAGE_USE_BASE64: "1"
      ENABLE_AGENT_GATEWAY: "0"
      OPENAI_API_KEY: "${LOBE_OPENAI_API_KEY:-}"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - "${APP_DATA_DIR}/config:/app/runtipi-config:ro"
    depends_on:
      lobehub-init:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "${LOBE_BIND_IP:-0.0.0.0}:${APP_PORT:-8292}:3210/tcp"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "/bin/node", "-e", "fetch('http://127.0.0.1:3210/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s

  postgresql:
    image: paradedb/paradedb:0.26.5-pg17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      POSTGRES_DB: lobehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOBE_DB_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR}/postgres:/var/lib/postgresql/data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -d lobehub"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - "${APP_DATA_DIR}/redis:/data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    command: ["--access-key", "${LOBE_S3_ACCESS_KEY}", "--secret-key", "${LOBE_S3_SECRET_KEY}", "/data"]
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: "${LOBE_S3_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${LOBE_S3_SECRET_KEY}"
    volumes:
      - "${APP_DATA_DIR}/rustfs:/data"
    depends_on:
      lobehub-init:
        condition: service_completed_successfully
    ports:
      - "${LOBE_BIND_IP:-0.0.0.0}:${LOBE_S3_HOST_PORT:-8293}:9000/tcp"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rustfs-init:
    image: rustfs/rc:v0.1.37
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - |
        rc alias set rustfs http://rustfs:9000 "$$S3_ACCESS" "$$S3_SECRET"
        rc mb rustfs/lobe --ignore-existing
        printf '%s\n' '{"Id":"","Statement":[{"Sid":"","Effect":"Allow","Principal":{"AWS":["*"]},"Action":["s3:GetObject"],"NotAction":[],"Resource":["arn:aws:s3:::lobe/*"],"NotResource":[],"Condition":{}}],"Version":"2012-10-17"}' > /tmp/bucket-policy.json
        rc anonymous set-json /tmp/bucket-policy.json rustfs/lobe
        printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' | rc bucket cors set rustfs/lobe -
    environment:
      S3_ACCESS: "${LOBE_S3_ACCESS_KEY}"
      S3_SECRET: "${LOBE_S3_SECRET_KEY}"
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

networks:
  lobehub-private:
    driver: bridge

x-runtipi:
  schema_version: 2
