# LobeHub 2.3.2 - Runtipi >= 4.9.1
# Acces LAN direct et Cloudflare Tunnel, sans routage Traefik.
# LobeHub : http://IP_DU_SERVEUR:8292
# RustFS prive, fichiers signes via le meme hostname /lobe/*.
services:
  lobehub-init:
    image: node:24-alpine
    restart: "no"
    user: "0:0"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require('node:fs');
        const crypto = require('node:crypto');
        const file = '/config/jwks.json';
        // RustFS 1.x s'execute en UID/GID 10001.
        fs.chownSync('/rustfs-data', 10001, 10001);
        if (!fs.existsSync(file)) {
          const { privateKey } = crypto.generateKeyPairSync('rsa', { modulusLength: 2048 });
          const key = {
            ...privateKey.export({ format: 'jwk' }),
            alg: 'RS256',
            use: 'sig',
            kid: crypto.randomBytes(8).toString('hex')
          };
          fs.writeFileSync(file, JSON.stringify({ keys: [key] }), { flag: 'wx', mode: 0o600 });
          fs.chownSync(file, 1001, 1001);
          console.log('JWKS prive cree et conserve dans config/jwks.json.');
        }
        const jwks = JSON.parse(fs.readFileSync(file, 'utf8'));
        if (!Array.isArray(jwks.keys) || !jwks.keys[0]?.d) throw new Error('JWKS invalide');
        // Nginx config persistante et initialise une seule fois.
        const nginxPath = '/config/nginx-gateway-v1.conf';
        if (!fs.existsSync(nginxPath)) {
          const conf = String.raw`
            map $$http_upgrade $$connection_upgrade {
              default upgrade;
              '' close;
            }
            map $$http_x_forwarded_proto $$client_proto {
              default $$scheme;
              https https;
            }
            map $$args $$s3_has_signature {
              default 0;
              "~*(^|&)X-Amz-Signature=[a-f0-9]{64}(&|$$)" 1;
            }
            map $$args $$s3_has_algorithm {
              default 0;
              "~*(^|&)X-Amz-Algorithm=AWS4-HMAC-SHA256(&|$$)" 1;
            }
            server {
              listen 8080;
              server_name _;
              server_tokens off;
              client_max_body_size 0;
              resolver 127.0.0.11 valid=10s ipv6=off;
            
              location = /lobe { return 403; }
              location = /lobe/ { return 403; }
              location ^~ /lobe/ {
                if ($$request_method = OPTIONS) {
                  add_header Access-Control-Allow-Origin '*' always;
                  add_header Access-Control-Allow-Methods 'GET, HEAD, PUT, OPTIONS' always;
                  add_header Access-Control-Allow-Headers '*' always;
                  add_header Access-Control-Max-Age 3600 always;
                  return 204;
                }
                if ($$s3_has_signature = 0) { return 403; }
                if ($$s3_has_algorithm = 0) { return 403; }
                limit_except GET HEAD PUT OPTIONS { deny all; }
            
                set $$s3_internal rustfs:9000;
                proxy_pass http://$$s3_internal$$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $$http_host;
                proxy_set_header Connection '';
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Expose-Headers;
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Expose-Headers 'ETag' always;
              }
              location / {
                set $$lobe_internal lobehub:3210;
                proxy_pass http://$$lobe_internal$$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $$http_host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $$http_host;
                proxy_set_header X-Forwarded-Proto $$client_proto;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
              }
            }
          `;
          fs.writeFileSync(nginxPath, conf.trimStart() + '\n', {flag: 'wx', mode: 0o644});
        }
        // Revision 3: configuration versionnee pour remplacer nginx-gateway-v1.conf.
        const nginxAdminPath = '/config/nginx-gateway-v2.conf';
        if (!fs.existsSync(nginxAdminPath)) {
          const gatewayConfig = String.raw`
            map $http_upgrade $connection_upgrade {
              default upgrade;
              '' close;
            }
            map $http_x_forwarded_proto $client_proto {
              default $scheme;
              https https;
            }
            map $args $s3_has_signature {
              default 0;
              "~*(^|&)X-Amz-Signature=[a-f0-9]{64}(&|$)" 1;
            }
            map $args $s3_has_algorithm {
              default 0;
              "~*(^|&)X-Amz-Algorithm=AWS4-HMAC-SHA256(&|$)" 1;
            }
            server {
              listen 8080;
              server_name _;
              server_tokens off;
              client_max_body_size 0;
              resolver 127.0.0.11 valid=10s ipv6=off;
            
              # Refus immediat des inscriptions, quel que soit le lien affiche par le client.
              location ^~ /api/auth/sign-up/ { return 403; }
              location = /signup { return 302 /signin; }
              location ^~ /signup/ { return 302 /signin; }
              location = /api/auth/sign-in/anonymous { return 403; }
              location = /api/auth/sign-in/social { return 403; }
            
              # Console d'administration : le HTML est statique mais les API sont
              # protegees par la session admin Better Auth (controle serveur).
              location = /_runtipi_admin { return 302 /_runtipi_admin/; }
              location = /_runtipi_admin/ {
                alias /etc/nginx/runtipi-admin/index.html;
                add_header Cache-Control 'no-store' always;
              }
            
              # La surface S3 autorise seulement les operations signees sur les objets.
              location = /lobe { return 403; }
              location = /lobe/ { return 403; }
              location ^~ /lobe/ {
                if ($request_method = OPTIONS) {
                  add_header Access-Control-Allow-Origin '*' always;
                  add_header Access-Control-Allow-Methods 'GET, HEAD, PUT, OPTIONS' always;
                  add_header Access-Control-Allow-Headers '*' always;
                  add_header Access-Control-Max-Age 3600 always;
                  return 204;
                }
                if ($s3_has_signature = 0) { return 403; }
                if ($s3_has_algorithm = 0) { return 403; }
                limit_except GET HEAD PUT OPTIONS { deny all; }
                set $s3_internal rustfs:9000;
                proxy_pass http://$s3_internal$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header Connection '';
                proxy_request_buffering off;
                proxy_buffering off;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
                proxy_hide_header Access-Control-Allow-Origin;
                proxy_hide_header Access-Control-Allow-Headers;
                proxy_hide_header Access-Control-Allow-Methods;
                proxy_hide_header Access-Control-Expose-Headers;
                add_header Access-Control-Allow-Origin '*' always;
                add_header Access-Control-Expose-Headers 'ETag' always;
              }
              location / {
                set $lobe_internal lobehub:3210;
                proxy_pass http://$lobe_internal$request_uri;
                proxy_http_version 1.1;
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Host $http_host;
                proxy_set_header X-Forwarded-Proto $client_proto;
                proxy_set_header Upgrade $http_upgrade;
                proxy_set_header Connection $connection_upgrade;
                proxy_read_timeout 600s;
                proxy_send_timeout 600s;
              }
            }
          `;
          fs.writeFileSync(nginxAdminPath, gatewayConfig.trimStart() + '\n', {flag: 'wx', mode: 0o644});
        }
        const adminHtmlPath = '/config/runtipi-admin-v1.html';
        if (!fs.existsSync(adminHtmlPath)) {
          const adminHtml = String.raw`
            <!doctype html>
            <html lang="fr">
            <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1">
            <meta name="referrer" content="no-referrer">
            <title>Gestion des comptes — LobeHub</title>
            <style>
            :root { color-scheme: light dark; font-family: system-ui, -apple-system, sans-serif; }
            body { max-width: 820px; margin: 36px auto; padding: 0 18px; line-height: 1.5; }
            h1 { font-size: 1.8rem; margin-bottom: 2px; }
            small, .muted { opacity: .75; }
            main { display: none; }
            form { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin: 22px 0; }
            label { display: flex; flex-direction: column; gap: 5px; }
            input { font: inherit; padding: 9px; border: 1px solid #8888; border-radius: 7px; }
            button { font: inherit; cursor: pointer; padding: 9px 16px; border-radius: 7px; }
            button:disabled { cursor: wait; opacity: .65; }
            a { color: inherit; }
            #message { white-space: pre-wrap; }
            #list { padding-left: 18px; }
            #list li { margin-bottom: 6px; }
            </style>
            </head>
            <body>
            <p><a href="/">← LobeHub</a></p>
            <h1>Gestion des utilisateurs</h1>
            <p class="muted">Accès réservé aux administrateurs Better Auth de cette instance.</p>
            <p id="message" role="status">Vérification de votre session…</p>
            <main id="admin">
            <h2>Créer un utilisateur</h2>
            <p>Le nouvel utilisateur pourra ensuite se connecter sur la page habituelle. Il n'y a pas d'inscription libre.</p>
            <form id="create">
            <label>Nom<input name="name" autocomplete="off" required minlength="2" maxlength="120"></label>
            <label>Adresse e-mail<input name="email" type="email" autocomplete="off" required></label>
            <label>Mot de passe provisoire<input name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="64"></label>
            <div><button id="submit" type="submit">Créer le compte</button></div>
            </form>
            <h2>Comptes existants</h2>
            <p><button id="refresh" type="button">Actualiser la liste</button></p>
            <ul id="list"></ul>
            </main>
            <script>
            'use strict';
            const msg = document.getElementById('message');
            const adminSection = document.getElementById('admin');
            const form = document.getElementById('create');
            const submit = document.getElementById('submit');
            const list = document.getElementById('list');
            const refresh = document.getElementById('refresh');
            function message(text) { msg.textContent = text; }
            async function api(path, options) {
              const response = await fetch('/api/auth' + path, {
                credentials: 'same-origin',
                cache: 'no-store',
                ...options
              });
              const data = await response.json().catch(() => ({}));
              if (!response.ok || data.error) {
                const err = data.message || (data.error && data.error.message) || ('HTTP ' + response.status);
                throw new Error(String(err));
              }
              return data;
            }
            async function loadUsers() {
              const result = await api('/admin/list-users?limit=100');
              const users = Array.isArray(result.users) ? result.users : (Array.isArray(result.data?.users) ? result.data.users : []);
              list.replaceChildren();
              for (const user of users) {
                const li = document.createElement('li');
                li.textContent = (user.name || user.fullName || 'Utilisateur') + ' — ' + user.email + ' (' + (user.role || 'user') + ')';
                list.appendChild(li);
              }
              if (users.length === 0) {
                const li = document.createElement('li');
                li.textContent = 'Aucun utilisateur renvoyé par le serveur.';
                list.appendChild(li);
              }
            }
            form.addEventListener('submit', async function (event) {
              event.preventDefault();
              submit.disabled = true;
              const values = Object.fromEntries(new FormData(form).entries());
              try {
                await api('/admin/create-user', {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    name: String(values.name).trim(),
                    email: String(values.email).trim().toLowerCase(),
                    password: String(values.password),
                    role: 'user'
                  })
                });
                form.reset();
                message('Compte créé. Communiquez le mot de passe provisoire à son titulaire par un canal sûr.');
                await loadUsers();
              } catch (error) { message('Création impossible : ' + error.message); }
              finally { submit.disabled = false; }
            });
            refresh.addEventListener('click', async function () {
              try { await loadUsers(); message('Liste actualisée.'); }
              catch (error) { message('Liste indisponible : ' + error.message); }
            });
            (async function () {
              try {
                const session = await api('/get-session');
                const roles = String(session.user?.role || '').split(',');
                if (!roles.includes('admin')) {
                  message('Accès refusé. Connectez-vous avec le compte administrateur sur /signin, puis revenez sur cette page.');
                  return;
                }
                adminSection.style.display = 'block';
                message('Session administrateur reconnue.');
                await loadUsers();
              } catch (error) { message('Connexion administrateur requise. Ouvrez /signin, puis réessayez. (' + error.message + ')'); }
            })();
            </script>
            </body>
            </html>
          `;
          fs.writeFileSync(adminHtmlPath, adminHtml.trimStart() + '\n', {flag: 'wx', mode: 0o644});
        }
    volumes:
      - "${APP_DATA_DIR}/config:/config"
      - "${APP_DATA_DIR}/rustfs:/rustfs-data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

  lobehub:
    image: lobehub/lobehub:2.3.2
    restart: unless-stopped
    entrypoint: ["/bin/node", "-e"]
    command:
      - |
        const fs = require('node:fs');
        const jwks = JSON.parse(fs.readFileSync('/app/runtipi-config/jwks.json', 'utf8'));
        if (!Array.isArray(jwks.keys) || !jwks.keys[0]?.d) throw new Error('JWKS absent ou invalide');
        process.env.JWKS_KEY = JSON.stringify(jwks);
        require('/app/startServer.js');
    environment:
      NODE_ENV: production
      APP_URL: "${LOBE_PUBLIC_URL}"
      INTERNAL_APP_URL: "http://localhost:3210"
      AUTH_ADDITIONAL_TRUSTED_ORIGINS: "${LOBE_LAN_ORIGIN}"
      AUTH_ALLOWED_EMAILS: ""
      AUTH_SECRET: "${LOBE_AUTH_SECRET}"
      KEY_VAULTS_SECRET: "${LOBE_KEY_VAULTS_SECRET}"
      DATABASE_URL: "postgresql://postgres:${LOBE_DB_PASSWORD}@postgresql:5432/lobehub"
      REDIS_URL: "redis://redis:6379"
      REDIS_PREFIX: "lobehub"
      REDIS_TLS: "0"
      S3_ENDPOINT: "${LOBE_PUBLIC_URL}"
      S3_INTERNAL_ENDPOINT: "http://rustfs:9000"
      S3_BUCKET: "lobe"
      S3_ENABLE_PATH_STYLE: "1"
      S3_ACCESS_KEY: "${LOBE_S3_ACCESS_KEY}"
      S3_ACCESS_KEY_ID: "${LOBE_S3_ACCESS_KEY}"
      S3_SECRET_ACCESS_KEY: "${LOBE_S3_SECRET_KEY}"
      S3_SET_ACL: "0"
      LLM_VISION_IMAGE_USE_BASE64: "1"
      ENABLE_AGENT_GATEWAY: "0"
      OPENAI_API_KEY: "${LOBE_OPENAI_API_KEY:-}"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - "${APP_DATA_DIR}/config:/app/runtipi-config:ro"
    depends_on:
      lobehub-init:
        condition: service_completed_successfully
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      rustfs-init:
        condition: service_completed_successfully
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "/bin/node", "-e", "fetch('http://127.0.0.1:3210/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 150s

  lobehub-admin-precheck:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # Aucun provisionnement automatique si une autre adresse est deja presente.
        # Le gate de connexion public attend la fin de cette verification.
        attempt=0
        while :; do
          if result=$(psql -X -A -t -v ON_ERROR_STOP=1 -v target_email="$ADMIN_EMAIL" <<'SQL'
        SELECT CASE
          WHEN EXISTS (SELECT 1 FROM users WHERE lower(email) = lower(:'target_email')) THEN 'existing_admin'
          WHEN EXISTS (SELECT 1 FROM users) THEN 'occupied'
          ELSE 'fresh'
        END;
        SQL
          ); then
            break
          fi
          attempt=$((attempt+1))
          if [ "$attempt" -ge 30 ]; then echo 'Schema utilisateur indisponible.' >&2; exit 1; fi
          sleep 3
        done
        if [ "$result" = occupied ]; then
          echo 'Instance deja peuplee : parametrer ADMIN_EMAIL avec un compte existant, puis relancer.' >&2
          exit 1
        fi
        case "$result" in
          fresh|existing_admin) printf '%s\n' "$result" > /config/runtipi-admin-state ;;
          *) echo 'Etat admin inattendu.' >&2; exit 1 ;;
        esac
    environment:
      PGHOST: postgresql
      PGPORT: "5432"
      PGDATABASE: lobehub
      PGUSER: postgres
      PGPASSWORD: "${LOBE_DB_PASSWORD}"
      ADMIN_EMAIL: "${LOBE_ADMIN_EMAIL}"
    volumes:
      - "${APP_DATA_DIR}/config:/config"
    depends_on:
      lobehub:
        condition: service_healthy
      postgresql:
        condition: service_healthy
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

  lobehub-admin-register:
    image: node:24-alpine
    restart: "no"
    entrypoint: ["node", "-e"]
    command:
      - |
        const fs = require('node:fs');
        (async () => {
          const state = fs.readFileSync('/config/runtipi-admin-state', 'utf8').trim();
          if (state === 'existing_admin') {
            console.log('Compte admin existant : aucun mot de passe modifie.');
            return;
          }
          if (state !== 'fresh') throw new Error('Etat de provisionnement invalide');
          const email = process.env.ADMIN_EMAIL?.trim().toLowerCase();
          const password = process.env.ADMIN_PASSWORD;
          if (!email || !email.includes('@')) throw new Error('Adresse admin manquante');
          if (!password || password.length < 12 || password.length > 64) {
            throw new Error('Mot de passe initial admin : 12 a 64 caracteres.');
          }
          const result = await fetch('http://lobehub:3210/api/auth/sign-up/email', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Origin: process.env.ADMIN_PUBLIC_ORIGIN },
            body: JSON.stringify({ name: 'Administrateur', email, password })
          });
          if (!result.ok) {
            console.error('API de creation du premier admin, code HTTP :', result.status);
            throw new Error('Creation du compte impossible ; verifier les journaux LobeHub.');
          }
          console.log('Premier compte cree. Attribution des droits dans le prochain service.');
        })().catch((error) => {console.error(error.message); process.exitCode = 1;});
    environment:
      ADMIN_EMAIL: "${LOBE_ADMIN_EMAIL}"
      ADMIN_PASSWORD: "${LOBE_INITIAL_ADMIN_PASSWORD}"
      ADMIN_PUBLIC_ORIGIN: "${LOBE_PUBLIC_URL}"
    volumes:
      - "${APP_DATA_DIR}/config:/config:ro"
    depends_on:
      lobehub-admin-precheck:
        condition: service_completed_successfully
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

  lobehub-admin-promote:
    image: postgres:17-alpine
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        # LobeHub a deja cree le compte et termine les migrations DB.
        psql -X -v ON_ERROR_STOP=1 -v target_email="$ADMIN_EMAIL" <<'SQL'
        BEGIN;
        SELECT pg_advisory_xact_lock(3210, 8292);
        SELECT set_config('runtipi.admin_email', :'target_email', true);
        DO $runtipi$
        DECLARE
          admin_user_id text;
          admin_role_id text;
        BEGIN
          SELECT id INTO admin_user_id FROM users
          WHERE lower(email) = lower(current_setting('runtipi.admin_email')) LIMIT 1;
          IF admin_user_id IS NULL THEN
            RAISE EXCEPTION 'Le compte administrateur configure est introuvable';
          END IF;
          UPDATE users SET role = 'admin' WHERE id = admin_user_id;
          INSERT INTO rbac_roles (id, name, display_name, description, is_system, is_active)
          SELECT 'runtipi-global-super-admin', 'super_admin', 'Global administrator',
                 'Role global du premier administrateur Runtipi', true, true
          WHERE NOT EXISTS (SELECT 1 FROM rbac_roles WHERE name = 'super_admin' AND workspace_id IS NULL);
          SELECT id INTO admin_role_id FROM rbac_roles
          WHERE name = 'super_admin' AND workspace_id IS NULL LIMIT 1;
          IF admin_role_id IS NULL THEN RAISE EXCEPTION 'Role super_admin introuvable'; END IF;
          INSERT INTO rbac_role_permissions (role_id, permission_id)
          SELECT admin_role_id, id FROM rbac_permissions WHERE is_active = true
          ON CONFLICT DO NOTHING;
          INSERT INTO rbac_user_roles (user_id, role_id, workspace_id)
          VALUES (admin_user_id, admin_role_id, NULL) ON CONFLICT DO NOTHING;
        END
        $runtipi$;
        COMMIT;
        SQL
        echo 'Premier administrateur global : controle Better Auth et RBAC attribues.'
    environment:
      PGHOST: postgresql
      PGPORT: "5432"
      PGDATABASE: lobehub
      PGUSER: postgres
      PGPASSWORD: "${LOBE_DB_PASSWORD}"
      ADMIN_EMAIL: "${LOBE_ADMIN_EMAIL}"
    depends_on:
      lobehub-admin-register:
        condition: service_completed_successfully
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

  lobehub-s3-gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    entrypoint: ["/usr/sbin/nginx", "-g", "daemon off;"]
    depends_on:
      lobehub-init:
        condition: service_completed_successfully
      lobehub:
        condition: service_healthy
      rustfs:
        condition: service_healthy
      lobehub-admin-promote:
        condition: service_completed_successfully
    volumes:
      - "${APP_DATA_DIR}/config/nginx-gateway-v2.conf:/etc/nginx/conf.d/default.conf:ro"
      - "${APP_DATA_DIR}/config/runtipi-admin-v1.html:/etc/nginx/runtipi-admin/index.html:ro"
    ports:
      - "${LOBE_BIND_IP:-0.0.0.0}:${APP_PORT:-8292}:8080/tcp"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/ >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s

  postgresql:
    image: paradedb/paradedb:0.26.5-pg17
    restart: unless-stopped
    command: ["postgres", "-c", "shared_preload_libraries=pg_search,pg_cron,pg_stat_statements"]
    environment:
      POSTGRES_DB: lobehub
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${LOBE_DB_PASSWORD}"
    volumes:
      - "${APP_DATA_DIR}/postgres:/var/lib/postgresql/data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -h 127.0.0.1 -d lobehub"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    volumes:
      - "${APP_DATA_DIR}/redis:/data"
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  rustfs:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    command: ["--access-key", "${LOBE_S3_ACCESS_KEY}", "--secret-key", "${LOBE_S3_SECRET_KEY}", "/data"]
    environment:
      RUSTFS_CONSOLE_ENABLE: "false"
      RUSTFS_ACCESS_KEY: "${LOBE_S3_ACCESS_KEY}"
      RUSTFS_SECRET_KEY: "${LOBE_S3_SECRET_KEY}"
    volumes:
      - "${APP_DATA_DIR}/rustfs:/data"
    depends_on:
      lobehub-init:
        condition: service_completed_successfully
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  rustfs-init:
    image: rustfs/rc:v0.1.37
    restart: "no"
    entrypoint: ["/bin/sh"]
    command:
      - -ec
      - |
        rc alias set rustfs http://rustfs:9000 "$$S3_ACCESS" "$$S3_SECRET"
        rc mb rustfs/lobe --ignore-existing
        rc anonymous set private rustfs/lobe
        printf '%s' '<CORSConfiguration><CORSRule><AllowedOrigin>*</AllowedOrigin><AllowedMethod>GET</AllowedMethod><AllowedMethod>PUT</AllowedMethod><AllowedMethod>HEAD</AllowedMethod><AllowedHeader>*</AllowedHeader><ExposeHeader>ETag</ExposeHeader><MaxAgeSeconds>3600</MaxAgeSeconds></CORSRule></CORSConfiguration>' | rc bucket cors set rustfs/lobe -
    environment:
      S3_ACCESS: "${LOBE_S3_ACCESS_KEY}"
      S3_SECRET: "${LOBE_S3_SECRET_KEY}"
    depends_on:
      rustfs:
        condition: service_healthy
    networks:
      - lobehub-private
    labels:
      traefik.enable: "false"

networks:
  lobehub-private:
    driver: bridge

x-runtipi:
  schema_version: 2
