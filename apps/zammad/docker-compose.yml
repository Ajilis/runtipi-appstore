# Zammad 7.2.2 sans Elasticsearch - acces Cloudflare Tunnel uniquement
# Adaptation de https://github.com/zammad/zammad-docker-compose
# Aucun routage Traefik : Cloudflare Tunnel pointe sur localhost:8285.
# Le connecteur Cloudflare doit tourner sur le meme hote en mode reseau host.

services:
  zammad-postgresql:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: zammad_production
      POSTGRES_USER: zammad
      POSTGRES_PASSWORD: ${ZAMMAD_DB_PASSWORD}
    volumes:
      - ${APP_DATA_DIR}/data/postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" psql -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 5

  zammad-redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    volumes:
      - ${APP_DATA_DIR}/data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad-memcached:
    image: memcached:1.6.45-alpine
    command: ["memcached", "-m", "256"]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "11211"]
      interval: 10s
      timeout: 5s
      retries: 5

  zammad-init:
    image: ghcr.io/zammad/zammad:7.2.2-0000
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad
    # Sauvegarde obligatoire avant recuperation d'une base Zammad inachevee, sans utilisateurs ni tickets.
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        export PGHOST="$$POSTGRESQL_HOST" PGPORT="$$POSTGRESQL_PORT"
        export PGUSER="$$POSTGRESQL_USER" PGPASSWORD="$$POSTGRESQL_PASS" PGDATABASE="$$POSTGRESQL_DB"
        # Lors d'une migration, zammad-backup restaure avant que les migrations Rails demarrent.
        # Une restauration echouee bloque le demarrage : ne pas initialiser une base partielle.
        if [ -d /var/tmp/zammad/restore ] && [ -n "$$(ls -A /var/tmp/zammad/restore)" ]; then
          echo "Restauration Zammad en attente : zammad-init attend la fin de l'import."
          until [ ! -d /var/tmp/zammad/restore ]; do
            sleep 3
          done
          echo "Dossier de restauration archive : reprise de l'initialisation."
        fi
        echo "Preflight Zammad : analyse de la base de donnees."
        tables="$$(psql -v ON_ERROR_STOP=1 -Atqc "SELECT to_regclass('public.users') IS NOT NULL AND to_regclass('public.tickets') IS NOT NULL AND to_regclass('public.settings') IS NOT NULL")"
        if [ "$$tables" = "t" ]; then
          users="$$(psql -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM public.users')"
          tickets="$$(psql -v ON_ERROR_STOP=1 -Atqc 'SELECT count(*) FROM public.tickets')"
          conflict="$$(psql -v ON_ERROR_STOP=1 -Atqc "SELECT count(*) FROM public.settings WHERE lower(name) = '6005_postmaster_filter_identify_group'")"
          if [ "$$users" = "0" ] && [ "$$tickets" = "0" ] && [ "$$conflict" != "0" ]; then
            echo "Installation inachevee : sauvegarde PostgreSQL."
            umask 077
            snapshot="/var/tmp/zammad/recovery-incomplete-init-$$(date -u +%Y%m%dT%H%M%SZ).dump"
            pg_dump --format=custom --file="$$snapshot"
            test -s "$$snapshot"
            echo "Sauvegarde creee : $$snapshot"
            psql -v ON_ERROR_STOP=1 -c 'BEGIN; DROP SCHEMA public CASCADE; CREATE SCHEMA public AUTHORIZATION zammad; COMMIT;'
            echo "Schema applicatif Zammad reinitialise."
          else
            echo "Donnees existantes preservees : aucune reinitialisation."
          fi
        else
          echo "Base vierge ou schema incomplet sans signature du conflit : aucune reinitialisation."
        fi
        /opt/zammad/bin/docker-entrypoint zammad-init
        touch /tmp/zammad-init-ready
        echo "Initialisation Zammad terminee."
        exec sleep infinity
    user: "0:0"
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/zammad-init-ready"]
      interval: 10s
      timeout: 5s
      start_period: 600s
      retries: 5
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy

  zammad-railsserver:
    image: ghcr.io/zammad/zammad:7.2.2-0000
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad:ro
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
      zammad-init:
        condition: service_healthy

    command: ["zammad-railsserver"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:3000"]
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

  zammad-scheduler:
    image: ghcr.io/zammad/zammad:7.2.2-0000
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad:ro
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
      zammad-init:
        condition: service_healthy

    command: ["zammad-scheduler"]

  zammad-websocket:
    image: ghcr.io/zammad/zammad:7.2.2-0000
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad:ro
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy
      zammad-init:
        condition: service_healthy

    command: ["zammad-websocket"]

  zammad-backup:
    # Demarre sans attendre zammad-init, afin de restaurer une sauvegarde avant les migrations.
    image: ghcr.io/zammad/zammad:7.2.2-0000
    restart: unless-stopped
    init: true
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    depends_on:
      zammad-postgresql:
        condition: service_healthy
      zammad-redis:
        condition: service_healthy
      zammad-memcached:
        condition: service_healthy

    command: ["zammad-backup"]
    user: "0:0"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad

  zammad-nginx:
    image: ghcr.io/zammad/zammad:7.2.2-0000
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Europe/Paris}
      POSTGRESQL_HOST: zammad-postgresql
      POSTGRESQL_PORT: "5432"
      POSTGRESQL_DB: zammad_production
      POSTGRESQL_USER: zammad
      POSTGRESQL_PASS: ${ZAMMAD_DB_PASSWORD}
      POSTGRESQL_DB_CREATE: "false"
      REDIS_URL: redis://zammad-redis:6379
      MEMCACHE_SERVERS: zammad-memcached:11211
      # Zammad est utilise sans Elasticsearch (pas de recherche plein texte indexee).
      ELASTICSEARCH_ENABLED: "false"
      # Cloudflare termine HTTPS et envoie du HTTP a Nginx.
      # Sans scheme=https, Zammad peut rejeter la session avec une erreur CSRF.
      NGINX_SERVER_SCHEME: "https"
      ZAMMAD_HTTP_TYPE: "https"
      ZAMMAD_FQDN: ${ZAMMAD_DOMAIN}
      NGINX_CLIENT_MAX_BODY_SIZE: 50M
      BACKUP_DIR: /var/tmp/zammad
      BACKUP_TIME: "03:00"
      BACKUP_ON_START: "false"
      HOLD_DAYS: "10"
    volumes:
      - ${APP_DATA_DIR}/data/storage:/opt/zammad/storage
      - ${APP_DATA_DIR}/data/backup:/var/tmp/zammad:ro
    command: ["zammad-nginx"]
    init: false
    depends_on:
      zammad-railsserver:
        condition: service_healthy
    # Port TCP 8285 accessible sur le LAN ; Cloudflare Tunnel peut aussi cibler 127.0.0.1:8285.
    # Ne pas rediriger le port 8285 depuis le routeur vers Internet.
    # Pas de Traefik et aucun port PostgreSQL/Redis/Memcached expose.
    ports:
      - "8285:8080/tcp"

x-runtipi:
  schema_version: 2
