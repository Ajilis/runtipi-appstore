# Postiz complet (Temporal + Elasticsearch), Runtipi 4.9.1.
# Publication HTTP sur le LAN pour Cloudflare Tunnel ; AUCUN routage Traefik.
# Seul le service Postiz expose un port hote.
services:
  postiz-init:
    image: busybox:1.36
    restart: "no"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /temporal-dynamicconfig /temporal-elasticsearch /postiz-config /postiz-uploads
        if [ ! -s /temporal-dynamicconfig/development-sql.yaml ]; then
          cat > /temporal-dynamicconfig/development-sql.yaml <<'EOF'
        limit.maxIDLength:
          - value: 255
            constraints: {}
        system.forceSearchAttributesCacheRefreshOnRead:
          - value: true
            constraints: {}
        EOF
        fi
        chown 1000:0 /temporal-elasticsearch
        chown 1000:1000 /postiz-config /postiz-uploads
    volumes:
      - "${APP_DATA_DIR}/temporal-dynamicconfig:/temporal-dynamicconfig"
      - "${APP_DATA_DIR}/temporal-elasticsearch:/temporal-elasticsearch"
      - "${APP_DATA_DIR}/config:/postiz-config"
      - "${APP_DATA_DIR}/uploads:/postiz-uploads"
    networks:
      - postiz-internal

  postiz:
    image: ghcr.io/gitroomhq/postiz-app:latest
    restart: unless-stopped
    ports:
      - "${POSTIZ_BIND_IP:-0.0.0.0}:${APP_PORT:-8287}:5000/tcp"
    environment:
      MAIN_URL: "${POSTIZ_PUBLIC_URL}"
      FRONTEND_URL: "${POSTIZ_PUBLIC_URL}"
      NEXT_PUBLIC_BACKEND_URL: "${POSTIZ_PUBLIC_URL}/api"
      BACKEND_INTERNAL_URL: "http://localhost:3000"
      JWT_SECRET: "${POSTIZ_JWT_SECRET}"
      DATABASE_URL: "postgresql://postiz:${POSTIZ_DB_PASSWORD}@postiz-db:5432/postiz"
      REDIS_URL: "redis://postiz-redis:6379"
      TEMPORAL_ADDRESS: "postiz-temporal:7233"
      IS_GENERAL: "true"
      RUN_CRON: "true"
      DISABLE_REGISTRATION: "${POSTIZ_DISABLE_REGISTRATION:-false}"
      STORAGE_PROVIDER: "local"
      UPLOAD_DIRECTORY: "/uploads"
      NEXT_PUBLIC_UPLOAD_DIRECTORY: "/uploads"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - "${APP_DATA_DIR}/config:/config"
      - "${APP_DATA_DIR}/uploads:/uploads"
    depends_on:
      postiz-init:
        condition: service_completed_successfully
      postiz-db:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
      postiz-temporal:
        condition: service_started
    networks:
      - postiz-internal
    healthcheck:
      test: ["CMD", "node", "-e", "const r=require('http').get('http://127.0.0.1:5000/',res=>process.exit(res.statusCode<500?0:1));r.on('error',()=>process.exit(1));r.setTimeout(4000,()=>{r.destroy();process.exit(1)})"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s

  postiz-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postiz
      POSTGRES_PASSWORD: "${POSTIZ_DB_PASSWORD}"
      POSTGRES_DB: postiz
    volumes:
      - "${APP_DATA_DIR}/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postiz -d postiz"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - postiz-internal

  postiz-redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - "${APP_DATA_DIR}/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - postiz-internal

  postiz-temporal-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: "${POSTIZ_TEMPORAL_DB_PASSWORD}"
      POSTGRES_DB: temporal
    volumes:
      - "${APP_DATA_DIR}/temporal-postgres:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - postiz-internal

  postiz-temporal-es:
    image: elasticsearch:7.17.27
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms256m -Xmx256m"
      cluster.routing.allocation.disk.threshold_enabled: "true"
      cluster.routing.allocation.disk.watermark.low: "512mb"
      cluster.routing.allocation.disk.watermark.high: "256mb"
      cluster.routing.allocation.disk.watermark.flood_stage: "128mb"
    volumes:
      - "${APP_DATA_DIR}/temporal-elasticsearch:/usr/share/elasticsearch/data"
    depends_on:
      postiz-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 8s
      retries: 30
      start_period: 60s
    networks:
      - postiz-internal

  postiz-temporal:
    image: temporalio/auto-setup:1.28.1
    restart: unless-stopped
    environment:
      DB: postgres12
      DB_PORT: "5432"
      POSTGRES_USER: temporal
      POSTGRES_PWD: "${POSTIZ_TEMPORAL_DB_PASSWORD}"
      POSTGRES_SEEDS: postiz-temporal-db
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
      ENABLE_ES: "true"
      ES_SEEDS: postiz-temporal-es
      ES_VERSION: v7
      TEMPORAL_NAMESPACE: default
    volumes:
      - "${APP_DATA_DIR}/temporal-dynamicconfig:/etc/temporal/config/dynamicconfig:ro"
    depends_on:
      postiz-init:
        condition: service_completed_successfully
      postiz-temporal-db:
        condition: service_healthy
      postiz-temporal-es:
        condition: service_healthy
    networks:
      - postiz-internal

networks:
  postiz-internal:
    driver: bridge

x-runtipi:
  schema_version: 2
