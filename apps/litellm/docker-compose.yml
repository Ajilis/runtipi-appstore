# LiteLLM v1.108.0 pour Runtipi 4.9.1
# LAN: http://IP_DU_SERVEUR:8294 ; Tunnel -> http://IP_DU_SERVEUR:8294
# Pas de Traefik, pas de publication PostgreSQL.
services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.108.0
    restart: unless-stopped
    init: true
    # Initialise config.yaml dans le même conteneur, puis lance LiteLLM.
    # Évite un conteneur one-shot compté comme arrêté par Runtipi 4.9.1.
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /app/litellm-config
        if [ ! -f /app/litellm-config/config.yaml ]; then
          printf '%s\\n' 'model_list: []' 'litellm_settings:' '  drop_params: true' > /app/litellm-config/config.yaml
        fi
        exec /app/docker/prod_entrypoint.sh --config /app/litellm-config/config.yaml --port 4000
    environment:
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm"
      LITELLM_MASTER_KEY: "sk-${LITELLM_MASTER_SECRET}"
      UI_USERNAME: "admin"
      UI_PASSWORD: "${LITELLM_ADMIN_PASSWORD}"
      LITELLM_SALT_KEY: "sk-${LITELLM_SALT_SECRET}"
      STORE_MODEL_IN_DB: "True"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - ${APP_DATA_DIR}/config:/app/litellm-config
    ports:
      - "8294:4000/tcp"
    labels:
      traefik.enable: "false"
    # Port pour l’éditeur Runtipi, sans is_main (donc sans routage Traefik).
    x-runtipi:
      internal_port: 4000
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    security_opt:
      - no-new-privileges:true

x-runtipi:
  schema_version: 2
