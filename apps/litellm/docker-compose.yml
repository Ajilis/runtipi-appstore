# LiteLLM v1.108.0 pour Runtipi 4.9.1
# LAN: http://IP_DU_SERVEUR:8294 ; Tunnel -> http://IP_DU_SERVEUR:8294
# Pas de Traefik, pas de publication PostgreSQL.
services:
  litellm-config-init:
    image: alpine:3.21
    restart: "no"
    command:
      - /bin/sh
      - -ec
      - |
        mkdir -p /config
        if [ ! -f /config/config.yaml ]; then
          cat > /config/config.yaml <<'CONFIG'
        # Configuration persistante LiteLLM ; modèles via l'UI ou ici.
        model_list: []
        litellm_settings:
          drop_params: true
        CONFIG
          chmod 644 /config/config.yaml
        fi
    volumes:
      - ${APP_DATA_DIR}/config:/config
    security_opt:
      - no-new-privileges:true

  litellm:
    image: ghcr.io/berriai/litellm:v1.108.0
    restart: unless-stopped
    init: true
    command: ["--config", "/app/litellm-config/config.yaml", "--port", "4000"]
    environment:
      DATABASE_URL: "postgresql://litellm:${LITELLM_DB_PASSWORD}@postgres:5432/litellm"
      LITELLM_MASTER_KEY: "sk-${LITELLM_MASTER_SECRET}"
      LITELLM_SALT_KEY: "sk-${LITELLM_SALT_SECRET}"
      STORE_MODEL_IN_DB: "True"
      TZ: "${TZ:-Europe/Paris}"
    volumes:
      - ${APP_DATA_DIR}/config:/app/litellm-config:ro
    ports:
      - "8294:4000/tcp"
    labels:
      traefik.enable: "false"
    depends_on:
      postgres:
        condition: service_healthy
      litellm-config-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    security_opt:
      - no-new-privileges:true

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: "${LITELLM_DB_PASSWORD}"
    volumes:
      - ${APP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
    security_opt:
      - no-new-privileges:true

x-runtipi:
  schema_version: 2
