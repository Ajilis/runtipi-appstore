<!doctype html>
<html lang="fr">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Vigie Patrimoine</title>
  <meta name="description" content="Vue globale et privée de votre patrimoine, auto-hébergée.">

  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <meta name="application-name" content="Vigie">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16211f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <script src="vendor/qrcode.js"></script>
  <script src="icons.js?v=__VERSION__"></script>
